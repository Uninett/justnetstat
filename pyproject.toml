[build-system]
requires = ["setuptools>=80.3.1", "wheel", "setuptools_scm[toml]>=8.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "justnetstat"
description = "Netstat-like views of routers and other network equipment, over SNMP"
authors = [{name="Sikt - Norwegian Agency for Shared Services in Education and Research", email="kontakt@sikt.no"}]
maintainers = [{name="Morten Brekkevold", email="morten.brekkevold@sikt.no"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "netsnmp-cffi>=0.2.0",
]
dynamic = ["version"]

[project.scripts]
justnetstat = "justnetstat.cli:main"

[dependency-groups]
test = [
    "pytest>7",
    "pytest-cov",
]
dev = [
    "ruff",
    "pre-commit",
    {include-group = "test"},
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"justnetstat" = ["mibs/*"]

[tool.setuptools_scm]
version_file = "src/justnetstat/version.py"
# For copies without git metadata, e.g. made by rsync
fallback_version = "0+unknown"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["BLE001", "E4", "E501", "E7", "E9", "F", "I", "UP"]
fixable = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["justnetstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["**/justnetstat/version.py"]
